plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

version = project.mod_version
group = project.mod_group_id

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main {
    java.srcDirs '../common/java-core', '../common/java-mc-1.21.1', '../common/java-jei-1.21.1',
            '../common/java-cobblemon-1.21.1', '../common/java-neoforge'
    resources.srcDir '../common/resources'
}

repositories {
    maven { url = 'https://artefacts.cobblemon.com/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.blamejared.com/' }
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // Optional Cobblemon support: only compiled against, never required at runtime
    compileOnly "com.cobblemon:neoforge:${cobblemon_version}"
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"

    // Optional JEI tab with all rules
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: version
    }
}

jar {
    archiveFileName = "Nekoro-RD-${project.mod_version}-NeoForge-${project.mc_version}.jar"
    from('../../LICENSE')
    manifest {
        attributes([
            'Specification-Title'   : project.mod_id,
            'Specification-Vendor'  : 'Alolan Xardas',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor' : 'Alolan Xardas'
        ])
    }
}
