plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = 'dev.xardas'
base.archivesName = 'nekororandomdrop'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main {
    java.srcDirs '../common/java-core', '../common/java-mc-1.21.1', '../common/java-jei-1.21.1', '../common/java-forge'
    resources.srcDir '../common/resources'
}

minecraft {
    mappings channel: 'official', version: minecraft_version
}

repositories {
    maven { url = 'https://artefacts.cobblemon.com/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.blamejared.com/' }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Optional Cobblemon support and JEI tab: only compiled against, never required at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/mods.toml') {
        expand version: version
    }
}

jar {
    archiveFileName = "Nekoro-RD-${version}-Forge-${minecraft_version}.jar"
    from('../../LICENSE')
    manifest {
        attributes([
            'Specification-Title'   : 'nekororandomdrop',
            'Specification-Vendor'  : 'Alolan Xardas',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Nekoro Random Drop',
            'Implementation-Version': version,
            'Implementation-Vendor' : 'Alolan Xardas'
        ])
    }
}
