plugins {
    id 'fabric-loom' version '1.17.20'
    id 'java-library'
}

version = mod_version
group = 'dev.xardas'
base.archivesName = 'nekoro_random_drop'

// Gradle runs on JDK 21, but 1.20.1 needs Java 17 bytecode
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

sourceSets.main {
    java.srcDirs '../common/java-core', '../common/java-mc-1.20.1', '../common/java-jei-1.20.1',
            '../common/java-cobblemon-1.20.1', '../common/java-fabric'
    resources.srcDir '../common/resources'
}

repositories {
    maven { url = 'https://artefacts.cobblemon.com/releases' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.blamejared.com/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Optional Cobblemon support and JEI tab: only compiled against, never required at runtime
    modCompileOnly("com.cobblemon:fabric:${cobblemon_version}") { transitive = false }
    compileOnly "org.jetbrains.kotlin:kotlin-stdlib:${kotlin_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
}

processResources {
    inputs.property 'version', version
    filesMatching('fabric.mod.json') {
        expand version: version
    }
}

jar {
    from('../../LICENSE')
}

remapJar {
    archiveFileName = "Nekoro-RD-${version}-Fabric-${minecraft_version}.jar"
}
